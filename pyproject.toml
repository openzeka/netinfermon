[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netinfermon"
version = "0.1.0"
description = "LLM inference benchmark with RDMA traffic monitoring, for ConnectX (mlx5) hosts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
svg = ["matplotlib>=3.8"]

[project.scripts]
netinfermon = "netinfermon.cli:main"

[tool.setuptools]
packages = ["netinfermon", "netinfermon.web"]

[tool.setuptools.package-data]
netinfermon = ["sampler/*.c", "data/*.txt", "plans/*.json"]
